apiVersion: v1
kind: Service
metadata:
  name: focusflow-backend
  namespace: focusflow
  labels:
    app: focusflow-backend
spec:
  type: ClusterIP
  selector:
    app: focusflow-backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: 5000
