apiVersion: v1
kind: Pod
metadata:
  name: focusflow-backend-test
  namespace: focusflow
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          curl --fail http://focusflow-backend:5000/api/health
